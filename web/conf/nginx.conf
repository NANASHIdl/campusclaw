# CampusClaw web 入口：只做两件事——返回静态文件、把 /api 与 /health 反向代理给 api。
#
# 明确不在此处做的事：
#   * 不查询会话、不访问数据库、不参与鉴权（信任边界在 Go 侧）
#   * 不把上传目录配置为静态资源（否则绕过班级校验即可直接下载）
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;

    # 上传请求体上限（与 api 的 MAX_UPLOAD_BYTES 保持同一量级）
    client_max_body_size 8m;

    # 前端 SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 上传目录不是本站静态资源：显式拒绝，避免 SPA 回退掩盖问题。
    # 文件只能通过受保护接口 /api/materials/{id}/file 获取。
    location ^~ /uploads/ {
        return 404;
    }

    # 向量库不在本站暴露：Qdrant 只在容器网络内可达，也不经本站反代。
    # 显式拒绝这些路径，避免 SPA 回退返回 index.html 造成误解。
    location ^~ /qdrant/ {
        return 404;
    }
    location = /qdrant {
        return 404;
    }
    location ^~ /collections/ {
        return 404;
    }
    location = /collections {
        return 404;
    }

    # 受保护接口：原样反向代理至 Go，Nginx 不做任何身份判断
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 问答需要调用对话网关（推理型模型较慢），读超时放宽到 120s
        proxy_read_timeout 120s;
    }

    # 健康检查：不要求认证，仅用于存活探测
    location = /health {
        proxy_pass http://api:8080/health;
        proxy_set_header Host $host;
        access_log off;
    }
}
