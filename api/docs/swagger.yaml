        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 上传本班材料
      tags:
      - materials
