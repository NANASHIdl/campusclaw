        name: chunk_strategy
        type: string
      - description: 分段最大长度（custom/hierarchy，100–2000）
        in: formData
        name: max_chars
        type: integer
      - description: 分段重叠度百分比（0–50）
        in: formData
        name: overlap_percent
        type: integer
      - description: 分段标识符（custom）
        in: formData
        name: separator
        type: string
      - description: 删除 URL 与电子邮箱（custom）
        in: formData
        name: remove_urls
        type: boolean
      - description: 折叠连续空白（custom）
        in: formData
        name: collapse_whitespace
        type: boolean
      produces:
