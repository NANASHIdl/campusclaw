basePath: /
definitions:
  campusclaw_api_internal_httpx.ErrorBody:
    properties:
      error:
        type: string
    type: object
  campusclaw_api_internal_retrieval.Hit:
    properties:
      chunk_id:
        type: integer
      chunk_index:
        type: integer
      end_offset:
        type: integer
      material_id:
        type: integer
      material_title:
        type: string
      rank_keyword:
        type: integer
      rank_vector:
        type: integer
      score_final:
        type: number
      score_keyword:
        type: number
      score_vector:
        type: number
      snippet:
        type: string
      start_offset:
        type: integer
    type: object
  internal_agent.Agent:
    properties:
      enabled:
        type: boolean
      id:
        type: integer
      material_ids:
        items:
          type: integer
        type: array
      name:
        type: string
      prompt:
        type: string
      skill_ids:
        items:
          type: integer
        type: array
    type: object
  internal_agent.WriteRequest:
    properties:
      enabled:
        type: boolean
      material_ids:
        items:
          type: integer
        type: array
      name:
        type: string
      prompt:
        type: string
      skill_ids:
        items:
          type: integer
        type: array
    type: object
  internal_auth.LoginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  internal_auth.LoginResponse:
    properties:
      token:
        type: string
      user:
        $ref: '#/definitions/internal_auth.User'
    type: object
  internal_auth.User:
    properties:
      class_id:
        description: 会话班级，租户列取值来源
        type: integer
      id:
        type: integer
      role:
        description: teacher | student
        type: string
      username:
        type: string
    type: object
  internal_chat.SendRequest:
    properties:
      agent_id:
        description: AgentID 仅为兼容而接收，实际不参与选择：智能体由会话锁定。
        type: integer
      content:
        type: string
    type: object
  internal_conversation.Conversation:
    properties:
      agent_id:
        type: integer
      class_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
      updated_at:
        type: string
      user_id:
        type: integer
    type: object
  internal_conversation.CreateRequest:
    properties:
      agent_id:
        type: integer
    type: object
  internal_materials.ReindexRequest:
    properties:
      collapse_whitespace:
        type: boolean
      max_chars:
        type: integer
      overlap_percent:
        type: integer
      remove_urls:
        type: boolean
      separator:
        type: string
      strategy:
        type: string
    type: object
  internal_materials.detailItem:
    properties:
      class_id:
        type: integer
      created_at:
        type: string
      id:
        type: integer
      title:
        type: string
    type: object
  internal_mcp.Server:
    properties:
      base_url:
        type: string
      connected:
        type: boolean
      created_at:
        type: string
      has_auth:
        type: boolean
      id:
        type: integer
      last_error:
        type: string
      name:
        type: string
      tool_count:
        type: integer
      updated_at:
        type: string
    type: object
  internal_mcp.WriteRequest:
    properties:
      auth_token:
        type: string
      base_url:
        type: string
      name:
        type: string
    type: object
  internal_qa.Answer:
    properties:
      answer:
        type: string
      citations:
        items:
          $ref: '#/definitions/campusclaw_api_internal_retrieval.Hit'
        type: array
      status:
        type: string
    type: object
  internal_qa.AskRequest:
    properties:
      history:
        items:
          $ref: '#/definitions/internal_qa.Message'
        type: array
      q:
        type: string
    type: object
  internal_qa.Message:
    properties:
      content:
        type: string
      role:
        type: string
    type: object
  internal_retrieval.Hit:
    properties:
      chunk_id:
        type: integer
      chunk_index:
        type: integer
      end_offset:
        type: integer
      material_id:
        type: integer
      material_title:
        type: string
      rank_keyword:
        type: integer
      rank_vector:
        type: integer
      score_final:
        type: number
      score_keyword:
        type: number
      score_vector:
        type: number
      snippet:
        type: string
      start_offset:
        type: integer
    type: object
  internal_retrieval.QueryVector:
    properties:
      dim:
        type: integer
      norm:
        type: number
      preview:
        items:
          type: number
        type: array
      vector:
        items:
          type: number
        type: array
    type: object
  internal_retrieval.Result:
    properties:
      hits:
        items:
          $ref: '#/definitions/internal_retrieval.Hit'
        type: array
      mode:
        type: string
      note:
        type: string
      query_vector:
        $ref: '#/definitions/internal_retrieval.QueryVector'
      status:
        type: string
    type: object
  internal_retrieval.SearchRequest:
    properties:
      mode:
        type: string
      q:
        type: string
    type: object
  internal_skill.Skill:
    properties:
      created_at:
        type: string
      description:
        type: string
      enabled:
        type: boolean
      id:
        type: integer
      name:
        type: string
      source:
        type: string
      subject:
        type: string
      tools:
        items:
          type: string
        type: array
      trigger:
        type: string
      updated_at:
        type: string
    type: object
  internal_skill.SourceRequest:
    properties:
      source:
        type: string
    type: object
info:
  contact: {}
  description: '按班级隔离的知识库与解题助手。认证方式为 JWT（HS256），请求头形如 `Authorization: Bearer <token>`；角色与班级一律由令牌
    sub 回查用户表得出。'
  title: CampusClaw API
  version: "1.0"
paths:
  /api/agents:
    get:
      description: 教师返回本班全部智能体；学生只返回已启用的。响应不含 class_id。
      operationId: AGT-001
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 列出本班智能体
      tags:
      - agents
    post:
      consumes:
      - application/json
      description: 仅教师。名称去空白后 1–64 字符且班内唯一；提示词不超过 2000 字符且允许为空（为空时回退默认角色）。skill_ids
        与 material_ids 必须属于本班，否则 404。同班同名返回 400。
      operationId: AGT-002
      parameters:
      - description: 智能体字段与绑定
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_agent.WriteRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_agent.Agent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 新建智能体
      tags:
      - agents
  /api/agents/{id}:
    get:
      description: 教师可读本班未启用的智能体；学生读到未启用、他班或不存在时都是同一个 404。
      operationId: AGT-003
      parameters:
      - description: 智能体编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_agent.Agent'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 读取一个智能体
      tags:
      - agents
    put:
      consumes:
      - application/json
      description: 仅教师。整份覆盖字段与绑定；提示词允许为空。跨班或不存在返回 404，与他人同名返回 400。
      operationId: AGT-004
      parameters:
      - description: 智能体编号
        in: path
        name: id
        required: true
        type: integer
      - description: 智能体字段与绑定
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_agent.WriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_agent.Agent'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 修改智能体
      tags:
      - agents
  /api/ask:
    post:
      consumes:
      - application/json
      description: 先以混合模式取本班前 4 条切片；有切片才调用对话网关，回答中以 [1]、[2] 标注出处。无命中时返回 status=no_evidence、固定文案与空
        citations，且不调用模型。
      operationId: SRC-002
      parameters:
      - description: 问句
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_qa.AskRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_qa.Answer'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 按本班资料作简短回答
      tags:
      - search
  /api/conversations:
    get:
      description: 只返回当前用户在本班的会话，按 updated_at 倒序。
      operationId: CNV-001
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 列出我的会话
      tags:
      - conversations
    post:
      consumes:
      - application/json
      description: 必须指定本班一个已启用的智能体，否则 404；请求体为空或 agent_id 小于 1 返回 400；本班没有已启用的智能体也返回
        400。会话创建后 agent_id 不再变更。
      operationId: CNV-002
      parameters:
      - description: 选定的智能体
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_conversation.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/internal_conversation.Conversation'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 按智能体新建会话
      tags:
      - conversations
  /api/conversations/{id}:
    get:
      description: 返回会话与其全部消息。他人会话、他班会话与不存在的会话返回同一个 404。
      operationId: CNV-003
      parameters:
      - description: 会话编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 读取会话和消息
      tags:
      - conversations
  /api/conversations/{id}/messages:
    post:
      consumes:
      - application/json
      description: 以 text/event-stream 逐段返回。事件依次为 meta（状态、命中技能、引用列表）、若干 delta（本次新增文本）、done（助手消息编号）；流开始后失败再推一条
        error，HTTP 状态保持 200。content 去空白后 2–500 字符。
      operationId: CNV-004
      parameters:
      - description: 会话编号
        in: path
        name: id
        required: true
        type: integer
      - description: 提问内容
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_chat.SendRequest'
      produces:
      - text/event-stream
      responses:
        "200":
          description: SSE 事件流
          schema:
            type: string
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 在会话中继续提问（SSE）
      tags:
      - conversations
  /api/login:
    post:
      consumes:
      - application/json
      description: '校验用户名与口令。账号不存在、口令错误与触发限流返回完全相同的状态码与响应体。成功后返回 HS256 JWT，其余接口以 `Authorization:
        Bearer <token>` 访问。'
      operationId: AUTH-001
      parameters:
      - description: 用户名与口令
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_auth.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_auth.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      summary: 登录并签发访问令牌
      tags:
      - auth
  /api/logout:
    post:
      description: 把当前令牌的 jti 写入吊销表。同一令牌再次调用会在鉴权阶段得到 401。
      operationId: AUTH-002
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 登出并吊销当前令牌
      tags:
      - auth
  /api/materials:
    get:
      description: 只返回会话所属班级的材料，按创建时间倒序。
      operationId: MAT-001
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 列出本班材料
      tags:
      - materials
  /api/materials/{id}:
    get:
      description: 跨班与不存在返回同一个 404。
      operationId: MAT-002
      parameters:
      - description: 材料编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_materials.detailItem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 读取本班材料详情
      tags:
      - materials
  /api/materials/{id}/file:
    get:
      description: 读取文件前完成认证与班级校验；跨班与不存在返回同一个 404。上传目录不作为静态资源暴露。
      operationId: MAT-003
      parameters:
      - description: 材料编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/octet-stream
      responses:
        "200":
          description: 材料原文
          schema:
            type: file
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 下载本班材料原文
      tags:
      - materials
  /api/materials/{id}/reindex:
    post:
      consumes:
      - application/json
      description: 仅教师。按请求指定的策略先删旧切片与旧向量再写入新的；参数越界返回 400。跨班与不存在返回同一个 404。
      operationId: MAT-006
      parameters:
      - description: 材料编号
        in: path
        name: id
        required: true
        type: integer
      - description: 切分参数
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/internal_materials.ReindexRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
      security:
      - bearerAuth: []
      summary: 重建本班某一材料的切片和向量
      tags:
      - materials
  /api/materials/{id}/vectors:
    get:
      description: 返回集合名、距离度量、维度，以及每条切片的向量、L2 范数与两库编号对应关系。跨班与不存在返回同一个 404。
      operationId: MAT-005
      parameters:
      - description: 材料编号
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/campusclaw_api_internal_httpx.ErrorBody'
        "404":
          description: Not Found
          schema:
