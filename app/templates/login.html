{% extends "base.html" %}
{% block title %}登录 · CampusClaw{% endblock %}
{% block content %}
  <div class="card">
    <h1>登录 CampusClaw</h1>
    <p class="sub">教师与学生均可登录；未登录访问受保护页面会被引导到本页。</p>

    {% if error %}<div class="error">{{ error }}</div>{% endif %}

    <form class="login" method="post" action="{{ url_for('auth.login') }}">
      <div>
        <label for="username">用户名</label>
        <input id="username" name="username" type="text" autocomplete="username" required autofocus>
      </div>
      <div>
        <label for="password">密码</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">登录</button>
    </form>

    <p class="hint">
      预置账号：教师 <code>teacher_a / teach123</code>，学生 <code>student_a1 / stu123</code>、<code>student_b1 / stu123</code>
    </p>
  </div>
{% endblock %}
